packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: false

catalog:
  '@sanity/pkg-utils': 12.0.1
  '@sanity/tsconfig': 2.2.1
  typescript: 7.0.2
  xstate: ^5.32.5

linkWorkspacePackages: deep

minimumReleaseAge: 4320

minimumReleaseAgeExclude:
  - '@oxfmt/*'
  - '@oxlint/*'
  - '@oxlint-tsgolint/*'
  - '@rollup/*'
  - '@sanity/*'
  - '@types/*'
  - '@typescript/*'
  - '@vite/*'
  - '@vitest/*'
  - 'groq'
  - 'get-it'
  - 'nanoid'
  - 'oxfmt'
  - 'oxlint'
  - 'oxlint-tsgolint'
  - 'rollup'
  - 'sanity'
  - 'vite'
  - 'vitest'

preferWorkspacePackages: true

publicHoistPattern:
  - '*prettier*'

trustPolicy: 'no-downgrade'
trustPolicyExclude:
  - '@octokit/endpoint@9.0.6'
  - '@octokit/plugin-paginate-rest@9.2.2'
  - '@sanity/sdk@2.1.2'
  - chokidar@4.0.3
  - groq@3.88.1-typegen-experimental.0
  - reselect@5.1.1
  - rxjs@7.8.2
  - semver@5.7.2 || 6.3.1
  - undici@5.29.0
  - vite@6.4.1
